# 0DTE Dealer Gamma Exposure - Docker Services

services:
  postgres:
    image: postgres:18-alpine
    container_name: odte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odte_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odte_password}
      POSTGRES_DB: ${POSTGRES_DB:-odte_gex}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-odte_user} -d ${POSTGRES_DB:-odte_gex}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Redis for caching (uncomment when needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: odte-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

volumes:
  postgres_data:
  # redis_data:
