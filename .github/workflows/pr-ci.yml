name: pr-ci

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  pull_request_review:
    types:
      - submitted

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  BUN_VERSION: "1.3.7"

jobs:
  backend-tests:
    name: backend-tests
    if: >-
      ${{
        github.event.pull_request.base.ref == 'main' &&
        (
          (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
          (github.event_name == 'pull_request_review' && github.event.pull_request.draft == false && github.event.review.state == 'approved')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests with coverage
        run: |
          set -euo pipefail
          mkdir -p reports
          # Keep PR CI deterministic by skipping the explicit network-backed integration mark.
          python -m pytest -q -m "not integration" \
            --cov-report=xml:coverage.xml \
            --junitxml=reports/backend-tests.xml

      - name: Upload backend test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-artifacts
          path: |
            backend/coverage.xml
            backend/reports/backend-tests.xml
          if-no-files-found: warn

  frontend-quality:
    name: frontend-quality
    if: >-
      ${{
        github.event.pull_request.base.ref == 'main' &&
        (
          (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
          (github.event_name == 'pull_request_review' && github.event.pull_request.draft == false && github.event.review.state == 'approved')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: |
          set -euo pipefail
          bun ci

      - name: Run ESLint
        run: |
          set -euo pipefail
          bun x eslint .

  frontend-tests:
    name: frontend-tests
    if: >-
      ${{
        github.event.pull_request.base.ref == 'main' &&
        (
          (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
          (github.event_name == 'pull_request_review' && github.event.pull_request.draft == false && github.event.review.state == 'approved')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: |
          set -euo pipefail
          bun ci

      - name: Run frontend tests with coverage
        run: |
          set -euo pipefail
          bun run test:run

      - name: Upload frontend coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-artifacts
          path: frontend/coverage/**
          if-no-files-found: warn

  frontend-build:
    name: frontend-build
    if: >-
      ${{
        github.event.pull_request.base.ref == 'main' &&
        (
          (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
          (github.event_name == 'pull_request_review' && github.event.pull_request.draft == false && github.event.review.state == 'approved')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: |
          set -euo pipefail
          bun ci

      - name: Build frontend
        run: |
          set -euo pipefail
          bun run build
