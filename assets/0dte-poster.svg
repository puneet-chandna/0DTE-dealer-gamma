<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390">
<defs>

  <pattern id="dg" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="8" cy="8" r=".55" fill="#0b1d32"/>
  </pattern>

  <linearGradient id="bgm" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#060e1e"/>
    <stop offset="100%" stop-color="#020810"/>
  </linearGradient>

  <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00ff99" stop-opacity=".95"/>
    <stop offset="100%" stop-color="#005c25" stop-opacity=".72"/>
  </linearGradient>

  <linearGradient id="ng" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7a0018" stop-opacity=".88"/>
    <stop offset="100%" stop-color="#ff3355" stop-opacity=".96"/>
  </linearGradient>

  <linearGradient id="sideAcc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#00e887"/>
    <stop offset="45%"  stop-color="#00ccff"/>
    <stop offset="100%" stop-color="#ff3355"/>
  </linearGradient>

</defs>

